<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:#f8f6f2;
  color:#333;
  overflow-x:hidden;
}

h1,h2,h3{
  font-family:'Playfair Display',serif;
}

/* COVER ANIMATION */
.cover{
  position:fixed;
  width:100%;height:100vh;
  top:0;left:0;
  background:url('https://images.unsplash.com/photo-1519741497674-611481863552') center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  z-index:9999;
  transition:1s;
}

.cover.hide{
  transform:translateY(-100%);
  opacity:0;
}

.btn{
  padding:12px 35px;
  border:none;
  background:white;
  cursor:pointer;
}

.section{
  padding:80px 20px;
  text-align:center;
}

/* COUPLE */
.couple{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.couple img{
  width:160px;height:160px;
  border-radius:50%;
  object-fit:cover;
  margin:10px 0;
}

/* COUNTDOWN */
.countdown{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
}
.countdown div{
  background:#fff;
  padding:10px;
  border-radius:10px;
  min-width:60px;
}

/* GALLERY SLIDER */
.slider{
  display:flex;
  overflow-x:auto;
  gap:10px;
  scroll-snap-type:x mandatory;
}
.slider img{
  width:80%;
  border-radius:10px;
  scroll-snap-align:center;
}

/* MUSIC BUTTON */
.music-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#000;
  color:#fff;
  padding:10px;
  border-radius:50%;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- COVER -->
<div class="cover" id="cover">
  <h3>The Wedding Of</h3>
  <h1>Fadli & Helen</h1>
  <p>Kepada</p>
  <h2 id="guest">Tamu Undangan</h2>
  <button class="btn" onclick="openInvite()">Open Invitation</button>
</div>

<!-- CONTENT -->
<div id="content" style="display:none">

<div class="section">
  <h1>Fadli & Helen</h1>
  <p>12 Desember 2026</p>

  <div class="countdown" id="countdown"></div>
</div>

<div class="section couple">
  <img src="https://randomuser.me/api/portraits/men/1.jpg">
  <h2>Fadli</h2>
  <p>Putra dari Bapak & Ibu</p>

  <img src="https://randomuser.me/api/portraits/women/1.jpg">
  <h2>Helen</h2>
  <p>Putri dari Bapak & Ibu</p>
</div>

<div class="section">
  <h2>Acara</h2>
  <p>Akad: 09.00 WIB</p>
  <p>Resepsi: 11.00 WIB</p>
  <iframe src="https://maps.google.com/maps?q=jakarta&t=&z=13&ie=UTF8&iwloc=&output=embed" width="100%" height="250" style="border:0"></iframe>
</div>

<div class="section">
  <h2>Gallery</h2>
  <div class="slider">
    <img src="https://picsum.photos/400/500?1">
    <img src="https://picsum.photos/400/500?2">
    <img src="https://picsum.photos/400/500?3">
  </div>
</div>

<div class="section">
  <h2>Kirim Ucapan</h2>
  <input id="nama" placeholder="Nama"><br><br>
  <textarea id="pesan" placeholder="Ucapan"></textarea><br><br>
  <button onclick="kirim()">Kirim</button>
  <div id="list"></div>
</div>

</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8f6d3e9b5.mp3">
</audio>

<div class="music-btn" onclick="toggleMusic()">♪</div>

<script>
function openInvite(){
  document.getElementById('cover').classList.add('hide');
  document.getElementById('content').style.display='block';
  document.getElementById('music').play();
}

function toggleMusic(){
  const m=document.getElementById('music');
  if(m.paused) m.play(); else m.pause();
}

// countdown
const target=new Date('2026-12-12').getTime();
setInterval(()=>{
  const now=new Date().getTime();
  const d=Math.floor((target-now)/(1000*60*60*24));
  const h=Math.floor((target-now)/(1000*60*60)%24);
  const m=Math.floor((target-now)/(1000*60)%60);
  const s=Math.floor((target-now)/(1000)%60);

  document.getElementById('countdown').innerHTML=
  `<div>${d}H</div><div>${h}J</div><div>${m}M</div><div>${s}D</div>`;
},1000);

// guest name
const url=new URLSearchParams(window.location.search);
const to=url.get('to');
if(to) document.getElementById('guest').innerText=to;

// ucapan
function kirim(){
  const n=document.getElementById('nama').value;
  const p=document.getElementById('pesan').value;
  const el=document.createElement('p');
  el.innerText=n+': '+p;
  document.getElementById('list').appendChild(el);
}
</script>

</body>
</html>
